<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --bg-dark:#120a1f;
    --bg-dark2:#1d1033;
    --purple-1:#2e1a47;
    --purple-2:#3d215c;
    --gold:#d4af37;
    --gold-light:#f3d675;
    --blue:#3b82f6;
    --blue-light:#93c5fd;
    --pink:#ec4899;
    --pink-light:#f9a8d4;
    --green:#10b981;
    --green-light:#6ee7b7;
    --text-light:#f1eaff;
    --text-muted:#b7a8d9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Tajawal',sans-serif;
    background:linear-gradient(160deg,var(--bg-dark) 0%, var(--bg-dark2) 50%, #140b26 100%);
    color:var(--text-light);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  #particles{
    position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  }
  .particle{
    position:absolute;
    bottom:-20px;
    border-radius:50%;
    background:radial-gradient(circle,var(--gold-light),transparent 70%);
    opacity:.5;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    to{ transform:translateY(-110vh) translateX(20px); opacity:0;}
  }
  .wrapper{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:30px 18px 80px;}

  header{text-align:center;padding:30px 10px 10px;}
  header h1{
    font-size:2.4rem;font-weight:900;
    background:linear-gradient(90deg,var(--gold-light),var(--gold),#fff6da);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(212,175,55,.3);
    animation:glow 3s ease-in-out infinite alternate;
  }
  @keyframes glow{from{filter:drop-shadow(0 0 2px rgba(212,175,55,.3))}to{filter:drop-shadow(0 0 18px rgba(212,175,55,.6))}}
  header p{color:var(--text-muted);margin-top:8px;font-size:1rem;}

  .stats-bar{
    display:grid;grid-template-columns:repeat(5,1fr);gap:14px;
    margin:28px 0;
  }
  .stat-card{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(212,175,55,.25);
    border-radius:16px;padding:18px 8px;text-align:center;
    backdrop-filter:blur(6px);
    transition:transform .3s, box-shadow .3s;
  }
  .stat-card:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(212,175,55,.2);}
  .stat-card .num{font-size:1.8rem;font-weight:900;color:var(--gold-light);}
  .stat-card .lbl{font-size:.8rem;color:var(--text-muted);margin-top:4px;}

  .search-box{
    position:relative;margin:20px 0 16px;
  }
  .search-box input{
    width:100%;padding:16px 50px 16px 20px;border-radius:50px;
    border:1px solid rgba(212,175,55,.35);
    background:rgba(255,255,255,.05);
    color:var(--text-light);font-family:inherit;font-size:1rem;
    outline:none;transition:.3s;
  }
  .search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.15);}
  .search-box i.fa-search{position:absolute;right:20px;top:50%;transform:translateY(-50%);color:var(--gold);}
  .search-box .clear-btn{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;display:none;
  }
  .search-box .clear-btn.show{display:block;}

  .filters{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:30px;
  }
  .filter-btn{
    padding:10px 20px;border-radius:30px;border:1px solid rgba(212,175,55,.3);
    background:rgba(255,255,255,.04);color:var(--text-light);cursor:pointer;
    font-family:inherit;font-size:.9rem;transition:.25s;
  }
  .filter-btn:hover{background:rgba(212,175,55,.15);}
  .filter-btn.active{
    background:linear-gradient(90deg,var(--gold),var(--gold-light));
    color:#2a1a0a;font-weight:700;border-color:transparent;
  }

  .no-results{
    text-align:center;color:var(--text-muted);padding:40px 0;display:none;
  }
  .no-results.show{display:block;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px;
  }

  .category-card{
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;overflow:hidden;
    backdrop-filter:blur(8px);
    transition:box-shadow .3s, transform .3s;
    border-top:3px solid var(--gold);
  }
  .category-card:hover{box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .category-card.men{border-top-color:var(--blue);}
  .category-card.women{border-top-color:var(--pink);}
  .category-card.oriental{border-top-color:var(--gold);}
  .category-card.counter{border-top-color:var(--green);}

  .category-title{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;cursor:pointer;user-select:none;
    background:rgba(255,255,255,.03);
  }
  .category-title .ttl{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;}
  .category-title .ttl i{font-size:1.1rem;}
  .men .ttl i{color:var(--blue-light);}
  .women .ttl i{color:var(--pink-light);}
  .oriental .ttl i{color:var(--gold-light);}
  .counter .ttl i{color:var(--green-light);}
  .category-title .count-badge{
    background:rgba(212,175,55,.15);color:var(--gold-light);
    padding:3px 12px;border-radius:20px;font-size:.78rem;margin-inline-start:10px;
  }
  .category-title .chev{transition:transform .3s;color:var(--text-muted);}
  .category-card.collapsed .chev{transform:rotate(-90deg);}
  .category-body{
    max-height:560px;overflow-y:auto;padding:6px 18px 18px;
    transition:max-height .35s ease, padding .35s ease;
  }
  .category-card.collapsed .category-body{max-height:0;padding:0 18px;overflow:hidden;}

  .category-body::-webkit-scrollbar{width:6px;}
  .category-body::-webkit-scrollbar-thumb{background:rgba(212,175,55,.4);border-radius:10px;}

  .rack-group{margin-top:14px;}
  .rack-title{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.82rem;color:var(--gold-light);
    background:rgba(212,175,55,.1);border-right:3px solid var(--gold);
    padding:4px 12px;border-radius:8px;margin-bottom:8px;font-weight:700;
  }
  .perfume-list{list-style:none;}
  .perfume-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 6px;border-bottom:1px dashed rgba(255,255,255,.08);
    font-size:.92rem;transition:background .2s;
  }
  .perfume-item:last-child{border-bottom:none;}
  .perfume-item:hover{background:rgba(212,175,55,.06);border-radius:8px;}
  .perfume-item.hidden-item{display:none;}

  .item-number{
    font-size:.68rem;font-weight:800;padding:3px 7px;border-radius:7px;
    min-width:52px;text-align:center;letter-spacing:.3px;direction:ltr;
    display:inline-block;
  }
  .item-number[data-type="men"]{background:rgba(59,130,246,.2);color:var(--blue-light);}
  .item-number[data-type="women"]{background:rgba(236,72,153,.2);color:var(--pink-light);}
  .item-number[data-type="unisex"]{background:rgba(16,185,129,.2);color:var(--green-light);}

  .item-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex-shrink:0;}

  .back-top{
    position:fixed;bottom:26px;left:26px;width:48px;height:48px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    color:#2a1a0a;border:none;cursor:pointer;font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 20px rgba(212,175,55,.4);
    opacity:0;pointer-events:none;transition:.3s;z-index:50;
  }
  .back-top.show{opacity:1;pointer-events:auto;}

  @media(max-width:700px){
    .stats-bar{grid-template-columns:repeat(2,1fr);}
    header h1{font-size:1.7rem;}
    .grid{grid-template-columns:1fr;}
  }
</style>

  </div>

  <div class="filters" id="filters">

/* ========================= RENDER ========================= */
function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = DATA.map(cat=>{
    const totalItems = cat.racks.reduce((s,r)=>s+r.items.length,0);
    const racksHtml = cat.racks.map(r=>`
      <div class="rack-group">
        <div class="rack-title"><i class="fa-solid fa-layer-group"></i> ${r.title}</div>
        <ul class="perfume-list">
          ${r.items.map(it=>`
            <li class="perfume-item">
              <span class="item-number" data-type="${it[2]}">${it[0]}</span>
              <span class="item-dot"></span>${it[1]}
            </li>`).join('')}
        </ul>
      </div>`).join('');
    return `
    <div class="category-card ${cat.type}" data-type="${cat.type}" id="${cat.id}">
      <div class="category-title" onclick="toggleCard('${cat.id}')">
        <div class="ttl"><i class="fa-solid ${cat.icon}"></i> ${cat.title} <span class="count-badge">${totalItems}</span></div>
        <i class="fa-solid fa-chevron-down chev"></i>
      </div>
      <div class="category-body">${racksHtml}</div>
    </div>`;
  }).join('');
}

/* ========================= HELPERS ========================= */
function normalizeArabic(str){
  return str
    .replace(/[أإآا]/g,'ا')
    .replace(/ة/g,'ه')
    .replace(/ى/g,'ي')
    .replace(/ؤ/g,'و')
    .replace(/ئ/g,'ي')
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}

function createParticles(){
  const container = document.getElementById('particles');
  const count = 28;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className='particle';
    const size = Math.random()*5+3;
    p.style.width=size+'px';
    p.style.height=size+'px';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(Math.random()*12+10)+'s';
    p.style.animationDelay=(Math.random()*10)+'s';
    container.appendChild(p);
  }
}

function animateNumber(el, target, duration=1200){
  let start=0;
  const stepTime = Math.max(Math.floor(duration/target),8);
  const inc = Math.ceil(target/(duration/stepTime));
  const timer = setInterval(()=>{
    start += inc;
    if(start>=target){ start=target; clearInterval(timer); }
    el.textContent = start;
  }, stepTime);
}

function updateStats(){
  const totalCount = document.querySelectorAll('.perfume-item').length;
  const categoryCount = document.querySelectorAll('.category-card').length;
  const menCount = document.querySelectorAll('.item-number[data-type="men"]').length;
  const womenCount = document.querySelectorAll('.item-number[data-type="women"]').length;
  const unisexCount = document.querySelectorAll('.item-number[data-type="unisex"]').length;

  animateNumber(document.getElementById('statTotal'), totalCount);
  animateNumber(document.getElementById('statCats'), categoryCount, 600);
  animateNumber(document.getElementById('statMen'), menCount);
  animateNumber(document.getElementById('statWomen'), womenCount);
  animateNumber(document.getElementById('statUnisex'), unisexCount);
}

function toggleCard(id){
  document.getElementById(id).classList.toggle('collapsed');
}

function clearSearch(){
  const input = document.getElementById('searchInput');
  input.value='';
  searchPerfumes();
  input.focus();
}

function filterCategory(type, btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  document.querySelectorAll('.category-card').forEach(card=>{
    if(type==='all' || card.dataset.type===type){
      card.style.display='';
    } else {
      card.style.display='none';
    }
  });

  // reset search state
  document.getElementById('searchInput').value='';
  document.getElementById('clearBtn').classList.remove('show');
  document.querySelectorAll('.rack-group').forEach(r=>r.style.display='');
  document.querySelectorAll('.perfume-item').forEach(li=>li.classList.remove('hidden-item'));
  document.getElementById('noResults').classList.remove('show');
}

function searchPerfumes(){
  const raw = document.getElementById('searchInput').value.trim();
  const term = normalizeArabic(raw);
  const clearBtn = document.getElementById('clearBtn');
  clearBtn.classList.toggle('show', raw.length>0);

  let anyVisibleCardHasResults = false;

  document.querySelectorAll('.category-card').forEach(card=>{
    if(card.style.display==='none') return; // respect active category filter
    let cardHasVisible = false;

    card.querySelectorAll('.rack-group').forEach(rack=>{
      let rackHasVisible = false;
      rack.querySelectorAll('.perfume-item').forEach(li=>{
        if(term===''){
          li.classList.remove('hidden-item');
          rackHasVisible = true;
          return;
        }
        const text = normalizeArabic(li.textContent);
        const rawText = li.textContent.toLowerCase();
        const match = text.includes(term) || rawText.includes(raw.toLowerCase());
        li.classList.toggle('hidden-item', !match);
        if(match) rackHasVisible = true;
      });
      rack.style.display = rackHasVisible ? '' : 'none';
      if(rackHasVisible) cardHasVisible = true;
    });

    if(cardHasVisible) anyVisibleCardHasResults = true;
  });

  const noResults = document.getElementById('noResults');
  if(raw.length>0 && !anyVisibleCardHasResults){
    noResults.classList.add('show');
  } else {
    noResults.classList.remove('show');
  }
}

function scrollToTop(){
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ========================= INIT ========================= */
document.addEventListener('DOMContentLoaded', ()=>{
  renderGrid();
  createParticles();
  updateStats();

  document.getElementById('searchInput').addEventListener('input', searchPerfumes);

  window.addEventListener('scroll', ()=>{
    const backTop = document.getElementById('backTop');
    if(window.scrollY > 400) backTop.classList.add('show');
    else backTop.classList.remove('show');
  });
});
</script>
